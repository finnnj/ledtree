[project]
name = "ledtree"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Finn Joniec", email = "finnjoniec@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "adafruit-blinka>=10.4.0",
    "adafruit-circuitpython-neopixel>=6.4.2",
    "rpi-ws281x>=5.0.0",
]

[project.scripts]
ledtree = "ledtree:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
